<!DOCTYPE html>
<html>
<head>
    <title>Manage Faculty</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh; background: #eef4ff; padding: 30px 40px 40px;
            text-align: center; display: flex; flex-direction: column;
            align-items: center; position: relative; overflow-x: hidden;
        }
        body::before {
            content: ""; position: fixed; width: 500px; height: 500px;
            background: #c7dcff; border-radius: 50%; top: -200px; right: -150px;
            z-index: -1; animation: move 8s ease-in-out infinite alternate;
        }
        body::after {
            content: ""; position: fixed; width: 400px; height: 400px;
            background: #d8f3ff; border-radius: 50%; bottom: -180px; left: -120px;
            z-index: -1; animation: move 10s ease-in-out infinite alternate-reverse;
        }
        @keyframes move { from { transform: translate(0,0); } to { transform: translate(-30px,30px); } }

        .top-bar {
            width: 100%; max-width: 1100px; display: flex;
            justify-content: flex-end; gap: 14px; margin-bottom: 40px; flex-wrap: wrap;
        }
        .top-bar a {
            padding: 10px 22px; background: #2864c7; color: white;
            text-decoration: none; border-radius: 8px; font-size: 15px;
            font-weight: 500; transition: 0.3s;
            box-shadow: 0 4px 10px rgba(40, 100, 199, 0.25);
        }
        .top-bar a:hover { background: #173f85; transform: translateY(-2px); }

        h1 { color: #173b70; font-size: 32px; margin-bottom: 12px; }
        .subtitle { color: #527a9b; font-size: 16px; margin-bottom: 30px; }

        .count-badge {
            display: inline-block; background: white; padding: 14px 28px;
            border-radius: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            color: #173b70; font-size: 18px; font-weight: 600;
            margin-bottom: 30px; border: 1px solid #dce8f5;
        }
        .count-badge span { color: #2864c7; font-weight: 700; font-size: 22px; margin-left: 6px; }

        .form-card {
            background: white; max-width: 1000px; width: 100%;
            padding: 28px 26px; border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            margin-bottom: 15px; display: flex; flex-wrap: wrap;
            gap: 14px; justify-content: center; align-items: center;
        }
        .form-card input, .form-card select {
            padding: 12px 16px; border: 1px solid #cfe0f2; border-radius: 8px;
            font-size: 15px; outline: none; transition: 0.3s;
            min-width: 180px; flex: 1; color: #173b70; background: white;
        }
        .form-card input:focus, .form-card select:focus {
            border-color: #2864c7; box-shadow: 0 0 0 3px rgba(40,100,199,0.15);
        }
        .form-card button {
            padding: 12px 26px; background: #2864c7; color: white; border: none;
            border-radius: 8px; font-size: 15px; font-weight: 500;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 10px rgba(40, 100, 199, 0.25);
        }
        .form-card button:hover { background: #173f85; transform: translateY(-2px); }

        #dupWarn {
            color: #e74c3c; font-size: 14px; font-weight: 500;
            margin: 0 auto 25px; max-width: 900px;
        }

        .item-list {
            max-width: 900px; width: 100%;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 18px; margin-bottom: 40px;
        }
        .item-card {
            background: white; padding: 20px; border-radius: 14px;
            box-shadow: 0 8px 22px rgba(0,0,0,0.07); transition: 0.3s;
            display: flex; flex-direction: column; gap: 8px;
            text-align: left; border-left: 5px solid #2864c7;
        }
        .item-card:hover { transform: translateY(-5px); box-shadow: 0 14px 32px rgba(0,0,0,0.12); }
        .item-card h3 { color: #173b70; font-size: 17px; margin-bottom: 4px; }
        .item-card p { color: #527a9b; font-size: 14px; margin: 0; }
        .item-card .delete-btn {
            margin-top: 10px; padding: 8px 14px; background: #e74c3c;
            color: white; border: none; border-radius: 6px; font-size: 13px;
            font-weight: 500; cursor: pointer; transition: 0.3s; align-self: flex-start;
        }
        .item-card .delete-btn:hover { background: #c0392b; }

        .empty {
            color: #7a94a8; font-size: 16px; padding: 30px; background: white;
            border-radius: 14px; box-shadow: 0 8px 22px rgba(0,0,0,0.06);
            width: 100%; max-width: 700px;
        }

        .mk {
            display: inline-block; padding: 13px 30px; background: #2864c7;
            color: white; text-decoration: none; border-radius: 8px;
            font-size: 16px; font-weight: 500; transition: 0.3s;
            min-width: 240px; box-shadow: 0 4px 10px rgba(40,100,199,0.25);
        }
        .mk:hover { background: #173f85; transform: translateY(-3px); }

        .hint {
            color: #7a94a8; font-size: 13px;
            margin-top: -20px; margin-bottom: 20px; font-style: italic;
        }
        .rule {
            color: #b03a2e; font-size: 14px; font-weight: 600;
            margin-top: -18px; margin-bottom: 22px;
        }

        @media (max-width: 550px) {
            body { padding: 20px; }
            h1 { font-size: 24px; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .top-bar a { text-align: center; }
            .form-card { flex-direction: column; }
            .form-card input, .form-card select, .form-card button { width: 100%; }
            .mk { width: 100%; min-width: unset; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="admin.html">Back to Admin</a>
        <a href="index.html">Logout</a>
    </div>

    <h1>Manage Faculty</h1>
    <p class="subtitle">Add teachers, their department, division, and subject</p>
    <p class="rule">📌 Rule: A faculty's department is fixed — but they can teach different subjects to different divisions.</p>

    <div class="count-badge">
        Total Faculty Entries: <span id="teacherCount">0</span>
    </div>

    <div class="form-card">
        <input type="text" id="tName" placeholder="Faculty Name (e.g. Mr. Sharma)" />
        <select id="tCourse" onchange="onCourseChange()">
            <option value="">Select Department</option>
        </select>
        <select id="tDivision" onchange="checkDuplicate()">
            <option value="">Select Division</option>
        </select>
        <input type="text" id="tSubject" placeholder="Subject (e.g. Mathematics)" />
        <input type="text" id="tEmail" placeholder="Email (optional)" />
        <button onclick="addTeacher()">➕ Add Faculty</button>
    </div>

    <p id="dupWarn"></p>

    <div class="item-list" id="teacherList"></div>

    <a href="admin.html" class="mk">← Back to Admin Panel</a>

    <script src="data.js"></script>
    <script>
        const KEY = 'teachers';
        let teachers  = loadList(KEY);

        let courses   = loadList('courses');   // { name, code }
        let divisions = loadList('divisions'); // { course, name, students, faculty }

        // ---- Reload divisions from storage (in case Division page updated them) ----
        function refreshDivisions() {
            divisions = loadList('divisions');
        }

        // ---- Fill Department (Course) dropdown ----
        function fillCourseDropdown() {
            const sel = document.getElementById('tCourse');
            const prev = sel.value;
            sel.innerHTML = `<option value="">Select Department</option>`;
            courses.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.name;
                opt.textContent = `${c.name} (${c.code})`;
                sel.appendChild(opt);
            });
            if (prev) sel.value = prev;
        }

        // ---- On department change → filter divisions ----
        function onCourseChange() {
            refreshDivisions();

            const courseName = document.getElementById('tCourse').value;
            const divSel = document.getElementById('tDivision');
            divSel.innerHTML = `<option value="">Select Division</option>`;

            if (!courseName) { checkDuplicate(); return; }

            const filtered = divisions.filter(d => d.course === courseName);

            if (filtered.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = 'No divisions for this department yet';
                opt.disabled = true;
                divSel.appendChild(opt);
                checkDuplicate();
                return;
            }

            filtered.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.name;
                // Show faculty hint if the division has one assigned
                const facHint = d.faculty ? ` • ${d.faculty}` : '';
                opt.textContent = `Division ${d.name} — ${d.students} students${facHint}`;
                divSel.appendChild(opt);
            });

            checkDuplicate();
        }

        // ---- Check rules before adding ----
        function checkDuplicate() {
            const warn = document.getElementById('dupWarn');
            warn.textContent = '';

            const name     = document.getElementById('tName').value.trim();
            const course   = document.getElementById('tCourse').value;
            const division = document.getElementById('tDivision').value;
            const subject  = document.getElementById('tSubject').value.trim();

            if (!name || !course) return;

            // Rule 1: Faculty department must be consistent
            const existing = teachers.find(t =>
                t.name.toLowerCase() === name.toLowerCase()
            );
            if (existing && existing.course.toLowerCase() !== course.toLowerCase()) {
                warn.textContent =
                    `⚠️ ${existing.name} is already registered under "${existing.course}". ` +
                    `A faculty cannot change department.`;
                return;
            }

            // Rule 2: Same faculty cannot teach the same subject to the same division twice
            if (division && subject) {
                const dup = teachers.some(t =>
                    t.name.toLowerCase()     === name.toLowerCase() &&
                    t.course.toLowerCase()   === course.toLowerCase() &&
                    t.division.toLowerCase() === division.toLowerCase() &&
                    t.subject.toLowerCase()  === subject.toLowerCase()
                );
                if (dup) {
                    warn.textContent =
                        `⚠️ ${name} already teaches "${subject}" to Division ${division}.`;
                }
            }
        }

        // ---- Render list ----
        function render() {
            const container = document.getElementById('teacherList');
            document.getElementById('teacherCount').textContent = teachers.length;

            if (teachers.length === 0) {
                container.innerHTML = `<div class="empty">No faculty added yet. Add one above.</div>`;
                return;
            }

            container.innerHTML = teachers.map((t, i) => `
                <div class="item-card">
                    <h3>${escapeHtml(t.name)}</h3>
                    <p>🏛 Department: ${escapeHtml(t.course || '—')}</p>
                    <p>👥 Division: ${escapeHtml(t.division || '—')}</p>
                    <p>📚 Subject: ${escapeHtml(t.subject)}</p>
                    ${t.email ? `<p>✉️ ${escapeHtml(t.email)}</p>` : ''}
                    <button class="delete-btn" onclick="del(${i})">🗑 Delete</button>
                </div>
            `).join('');
        }

        function addTeacher() {
            const name     = document.getElementById('tName').value.trim();
            const course   = document.getElementById('tCourse').value;
            const division = document.getElementById('tDivision').value;
            const subject  = document.getElementById('tSubject').value.trim();
            const email    = document.getElementById('tEmail').value.trim();

            if (!name || !course || !division || !subject) {
                alert('Name, Department, Division and Subject are required.');
                return;
            }

            // Verify the division actually exists in that course
            refreshDivisions();
            const validDivision = divisions.some(d =>
                d.course.toLowerCase() === course.toLowerCase() &&
                d.name.toLowerCase()   === division.toLowerCase()
            );
            if (!validDivision) {
                alert(`❌ Division "${division}" does not exist in ${course}. Please add it first in Manage Divisions.`);
                return;
            }

            // Rule 1: Faculty's department is fixed
            const existing = teachers.find(t =>
                t.name.toLowerCase() === name.toLowerCase()
            );
            if (existing && existing.course.toLowerCase() !== course.toLowerCase()) {
                alert(
                    `❌ ${existing.name} is already registered under "${existing.course}".\n` +
                    `A faculty cannot change department.`
                );
                return;
            }

            // Rule 2: Same faculty cannot teach same subject to same division twice
            const dup = teachers.some(t =>
                t.name.toLowerCase()     === name.toLowerCase() &&
                t.course.toLowerCase()   === course.toLowerCase() &&
                t.division.toLowerCase() === division.toLowerCase() &&
                t.subject.toLowerCase()  === subject.toLowerCase()
            );
            if (dup) {
                alert(`❌ ${name} already teaches "${subject}" to Division ${division}.`);
                return;
            }

            teachers.push({ name, course, division, subject, email });
            saveList(KEY, teachers);

            // Reset only the fields that should clear
            document.getElementById('tName').value = '';
            document.getElementById('tDivision').value = '';
            document.getElementById('tSubject').value = '';
            document.getElementById('tEmail').value = '';
            // Keep tCourse selected so user can quickly add another (division, subject)
            document.getElementById('dupWarn').textContent = '';
            render();
        }

        function del(i) {
            if (!confirm('Delete this faculty entry?')) return;
            teachers.splice(i, 1);
            saveList(KEY, teachers);
            render();
        }

        // ---- Init ----
        fillCourseDropdown();
        refreshDivisions();
        render();

        // Refresh division list if user switches back to this tab
        window.addEventListener('focus', () => {
            refreshDivisions();
            onCourseChange();
        });
    </script>

</body>
</html>
