<!DOCTYPE html>
<html>
<head>
    <title>View Timetables</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

</head>
<body>

    <div class="top-bar">
        <a href="admin.html">Back to Admin</a>
        <a href="timetable_generator.html">Generate Timetable</a>
        <a href="index.html">Logout</a>
    </div>

    <h1>Saved Timetables</h1>
    <p class="subtitle">All timetables you have generated and saved.</p>

    <div class="filter-card">
        <select id="fCourse" onchange="renderList()">
            <option value="">All Courses</option>
        </select>
        <select id="fDivision" onchange="renderList()">
            <option value="">All Divisions</option>
        </select>
    </div>

    <div class="tt-list" id="ttList"></div>

    <script src="data.js"></script>
    <script>
        const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        let timetables = loadList('timetables');
        let courses    = loadList('courses');
        let divisions  = loadList('divisions');

        function fillFilters() {
            const cSel = document.getElementById('fCourse');
            cSel.innerHTML = `<option value="">All Courses</option>`;
            courses.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.name;
                opt.textContent = `${c.name}${c.code ? ' (' + c.code + ')' : ''}`;
                cSel.appendChild(opt);
            });

            const dSel = document.getElementById('fDivision');
            dSel.innerHTML = `<option value="">All Divisions</option>`;
            divisions.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.name;
                opt.textContent = `Division ${d.name} (${d.course})`;
                dSel.appendChild(opt);
            });
        }

        function renderList() {
            const course = document.getElementById('fCourse').value.toLowerCase();
            const division = document.getElementById('fDivision').value.toLowerCase();
            const container = document.getElementById('ttList');

            let list = [...timetables];

            if (course)   list = list.filter(t => t.course.toLowerCase() === course);
            if (division) list = list.filter(t => t.division.toLowerCase() === division);

            if (list.length === 0) {
                container.innerHTML = `<div class="empty">No saved timetables match your filters.</div>`;
                return;
            }

            list.sort((a, b) => new Date(b.savedAt || 0) - new Date(a.savedAt || 0));

            container.innerHTML = list.map((t) => {
                const originalIndex = timetables.indexOf(t);
                const savedDate = t.savedAt
                    ? new Date(t.savedAt).toLocaleString()
                    : '—';

                let html = '<div class="table-scroll"><table class="tt"><thead><tr><th>Day</th>';
                for (let p = 0; p < t.periods; p++) {
                    html += `<th>Period ${p + 1}</th>`;
                }
                html += '</tr></thead><tbody>';

                for (let d = 0; d < t.days; d++) {
                    html += `<tr><th>${DAY_NAMES[d]}</th>`;
                    for (let p = 0; p < t.periods; p++) {
                        const cell = t.grid[d][p];
                        if (cell) {
                            html += `
                                <td class="filled" title="${escapeHtml(cell.faculty)}">
                                    <span class="subject">${escapeHtml(cell.subject)}</span>
                                    <span class="faculty">${escapeHtml(cell.faculty)}</span>
                                </td>`;
                        } else {
                            html += `<td class="empty">—</td>`;
                        }
                    }
                    html += '</tr>';
                }
                html += '</tbody></table></div>';

                return `
                    <div class="tt-card">
                        <div class="tt-card-head">
                            <div>
                                <h2>${escapeHtml(t.course)} — Division ${escapeHtml(t.division)}</h2>
                                <p class="meta">${t.days} days × ${t.periods} periods · Saved: ${escapeHtml(savedDate)}</p>
                            </div>
                            <button class="delete-btn" onclick="del(${originalIndex})">🗑 Delete</button>
                        </div>
                        ${html}
                    </div>
                `;
            }).join('');
        }

        function del(i) {
            if (!confirm('Delete this saved timetable?')) return;
            timetables.splice(i, 1);
            saveList('timetables', timetables);
            renderList();
        }

        fillFilters();
        renderList();
    </script>

</body>
</html>
