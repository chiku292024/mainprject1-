<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #eef4ff;

            position: relative;
            overflow: hidden;
        }

        /* Subtle background animation */
        body::before {
            content: "";
            position: absolute;

            width: 500px;
            height: 500px;

            background: #c7dcff;
            border-radius: 50%;

            top: -200px;
            right: -150px;

            animation: move 8s ease-in-out infinite alternate;
        }

        body::after {
            content: "";
            position: absolute;

            width: 400px;
            height: 400px;

            background: #d8f3ff;
            border-radius: 50%;

            bottom: -180px;
            left: -120px;

            animation: move 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes move {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-30px, 30px);
            }
        }

        /* Login box */
        form {
            position: relative;
            z-index: 1;

            width: 400px;
            padding: 40px;

            background: white;

            border-radius: 16px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        h2 {
            text-align: center;

            color: #173b70;

            font-size: 30px;

            margin-bottom: 10px;
        }

        p {
            text-align: center;

            color: #666;

            font-size: 14px;

            margin-bottom: 30px;
        }

        label {
            display: block;

            color: #333;

            font-size: 15px;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            font-size: 15px;

            border: 1px solid #b8c7dc;

            border-radius: 8px;

            outline: none;
        }

        input:focus {
            border-color: #2864c7;
        }

        button {
            width: 100%;

            padding: 12px;

            background: #2864c7;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #173f85;

            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <form action="admin.html">

        <h2>LOGIN</h2>

        <p>
            Please enter your credentials to access the admin panel.
        </p>

        <label for="username">Username:</label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
        >

        <label for="password">Password:</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">Login</button>

    </form>
<script>

    document.addEventListener("DOMContentLoaded", () => {

        const form = document.querySelector("form");

        const usernameInput = document.getElementById("username");

        const passwordInput = document.getElementById("password");


        form.addEventListener("submit", (event) => {

            event.preventDefault();

            const username = usernameInput.value.trim();

            const password = passwordInput.value.trim();


            //  username and password

            if (username === "admin" && password === "password123") {

                window.location.href = "admin.html";

            } else {

                alert("Invalid username or password. Please try again.");

            }

        });

    });

</script>

    </script>   
</body>

</html>
